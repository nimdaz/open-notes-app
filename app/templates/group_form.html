{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Group' if is_edit else 'Add Group' }}</h2>

{% if error %}
<article style="border-left: 4px solid var(--pico-del-color);">{{ error }}</article>
{% endif %}

<form method="post"
      action="{{ url_for('groups.group_update', group_id=group_id) if is_edit else url_for('groups.group_create') }}">
  <label>Name
    <input type="text" name="name" value="{{ name }}" required autocomplete="off">
  </label>

  <label>Description
    <textarea name="description" rows="3" placeholder="Optional notes about this group...">{{ description or '' }}</textarea>
  </label>

  <button type="submit">Save</button>
  <a href="{{ url_for('groups.groups_list') }}" role="button" class="secondary">Cancel</a>
</form>

{% if is_edit %}
<form method="post" action="{{ url_for('groups.group_delete', group_id=group_id) }}"
      onsubmit="return confirm('Delete this group? Its notes become unsorted.');"
      style="margin-top:1.5rem;">
  <button type="submit" class="contrast">Delete Group</button>
</form>
{% endif %}
{% endblock %}
